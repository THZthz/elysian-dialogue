[[notes]]
name = "The Legionnaire's Secret"
content = """
Garrick shared a bottle of brandy with Crowne hours before the death. His story has shifted three times:
1. First: strangers making small talk.
2. Then: Crowne bought him the drink.
3. Finally: Crowne questioned him about his military posting in the northern provinces — specifically a remote fort that held special prisoners.

The player felt an unexplained recognition at the mention of the northern provinces — a cold wind, a stone tower, a face in the snow. Crowne was using Garrick to confirm something about the player's past.

Garrick's northern posting involved guarding a facility for prisoners the Empire wanted to forget — political detainees, mages who'd broken imperial law, people whose existence was inconvenient. If the player was one of those prisoners, Garrick may have been one of their guards. Whether Garrick is protecting the player, protecting himself, or simply unwilling to admit what he told Crowne, his full testimony could bridge the gap between the player's amnesia and Crowne's murder.
"""
aboutEntities = ["Garrick", "Elias Crowne", "Player"]
