content = """
Thea, the lead attendant, was making her rounds near Passenger Car A at midnight. She saw something — or someone — but has refused to speak.

Raised in the Karavelle Warrens, she learned early that silence is survival and that authorities protect their own before the powerless. She trusts no one aboard, least of all Conductor Voss, whose primary concern is reputation.

Thea will only confide in someone who proves they are trustworthy — either through shared background (she and Silas are both from the Warrens, though neither has acknowledged it) or demonstrated willingness to risk their safety for hers. Her testimony likely identifies the killer's movements — or confirms who was definitively not in the corridor at the time of the murder.

The killer may already suspect she knows. If the player doesn't reach her first, someone else might — with different intentions.
"""
