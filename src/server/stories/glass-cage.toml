[[notes]]
name = "Ley-Line Interference: Accident or Attack?"
content = """
Ysara va Keth's field resonator has tracked growing instability in the Aethon's ley-line stabilizers since before the murder. Kest Winder confirms the readings and has been unable to identify a failing component.

**Possible interference sources**:
- Dravos's locked case — its emissions match the interference pattern. But correlation is not causation.
- A resonance device — the missing galley items (copper wire, brass fitting) could be assembled into a simple harmonic disruptor.
- An external saboteur — the scorch marks on the engine room door suggest someone attempted to breach Kest's domain.
- A natural phenomenon — the Aethon's route crosses a rare harmonic node. Ysara is here specifically to study it. The timing with the murder could be coincidence.

The interference increased sharply at midnight, precisely when Crowne was killed. If the interference was a byproduct of the murder method (using an arcane pulse to bypass the compartment seal), the killer may have inadvertently endangered the entire conveyor. If it continues unchecked, the Aethon may not reach Karavelle at all.

**GM note**: The interference and the murder are connected, but the nature of that connection is flexible. It could be cause, effect, coincidence, or red herring. Let the story decide.
"""
