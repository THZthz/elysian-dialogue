# NOTES — GM reference: backstory, secrets, motives, and color.
# ═══════════════════════════════════════════════════════════════════

# ── Character Dossiers ──

[[notes]]
name = "Dossier: Player"
content = """
## Identity & Amnesia

The player remembers nothing — not their name, not their destination, not how Crowne's blood got on their hands. The amnesia may be natural (trauma, head injury), induced (alchemical or sorcerous means), or voluntary (a memory seal the player placed on themselves). The truth is left open for the story to discover.

## Connection to Elias Crowne

Crowne knew the player before the amnesia. Hours before his death, they argued in the observation car — a heated exchange witnessed by other passengers. The player stormed out. Whether Crowne was a friend bringing a warning, a broker selling them out, or something else entirely died with him.

## The Key

The brass key with the scratched-off number was found beside the player. It does not open their compartment or Crowne's. It opens an unknown lock somewhere on the conveyor.

## The Northern Provinces

When Garrick mentioned Crowne asking about a military posting in the northern provinces, the player felt an unexplained recognition — a cold wind, a stone tower, a face in the snow. The connection between the player's past, the northern provinces, and Crowne's interest is a central mystery.

## GM Guidance

The player is both detective and suspect. Every piece of evidence about Crowne's murder is also a potential clue about their own past. The two investigations — who killed Crowne, and who the player is — are intertwined. The truth of the player's identity should be discovered alongside (or through) solving the murder.

But not everything needs to be about the murder. The player is also a person on a train — they can share meals, watch the stars, have conversations that go nowhere. Those moments make the investigation matter.
"""
aboutEntities = ["Player", "Elias Crowne", "Player's Key", "Garrick"]
aboutPlots = ["The Glass Cage", "The Truth"]

[[notes]]
name = "Dossier: Elias Crowne"
content = """
## Background

Elias Crowne dealt in secrets the way other men dealt in grain futures. Based in Valdris with a network stretching to Karavelle and beyond, he bought and sold information with practiced neutrality. His ledger — a ciphered journal containing every transaction, every secret, every client — was his life's work and his life insurance.

## Personality

Unremarkable by design. He cultivated forgettability the way other men cultivated reputations. In a room, he was the person you didn't notice until you needed him. He was not cruel, not kind — he was transactional, and he believed that information wanted to be free in the same way that money wanted to be spent. The drinking on his last night was out of character. Something had scared him.

## Network

- **Silas**: Crowne's contact in Karavelle. Fed him information from Valdris. In exchange, Silas provided protection and a cut of the profits.
- **Lady Mireille Tessier**: Crowne's secret source in diplomatic circles. She fed him information for years. Their relationship was professional, then complicated.
- **Lord Aldric Vane**: Crowne was blackmailing Vane over fraudulent accounts. He had let Vane know, quietly, that his silence had a price.
- **Garrick**: Hours before his death, Crowne questioned Garrick about a military posting in the northern provinces — apparently connecting the player to something in that region.

## Final Hours

- Argued with the player in the observation car.
- Shared brandy with Garrick in the dining car, questioning him about northern provinces.
- Visited Purser Locke's office, seeking access to the passenger manifest — refused.
- Spoke with Brother Malachai in the lounge car around 11pm — agitated, drinking heavily. Malachai will not reveal what was said.
- Stabbed at approximately midnight. Door locked from inside. Ledger missing.

## The Ledger

Crowne's ledger is the most valuable object on the conveyor — and the most dangerous. It contains records of every secret he ever bought or sold. Whoever has it can destroy half the passengers aboard. If it was thrown into the Grey Flats, the truth dies with it.
"""
aboutEntities = ["Elias Crowne", "Crowne's Ledger", "Silas", "Lady Mireille Tessier", "Lord Aldric Vane", "Garrick", "Brother Malachai", "Oren Locke", "Player"]
aboutPlots = ["The Glass Cage"]

[[notes]]
name = "Dossier: Lord Aldric Vane"
content = """
## Background

House Vane made its fortune in alchemical textiles three generations ago. Bad investments and worse luck have hollowed out the vaults. Lord Vane maintains the facade with desperate precision — the clothes are good but old, the cane is inherited, the boots are repaired because replacement is too expensive. His wife died three years ago. His daughter is at university and writes him letters that he reads and re-reads in his compartment.

## Personality

He is not a bad man. He is a proud man in an impossible situation, and pride makes people do foolish things. He quotes obscure poetry when he's nervous. He tips the crew excessively because generosity is the only form of wealth he can still display. He cannot sleep without warm milk — a childhood habit he's embarrassed by. The crew know and bring it to him without being asked.

## Motive

Crowne possessed documentation proving that the last three years of Vane's balance sheets were fraudulent. Crowne had communicated a demand for payment before boarding. Vane could not afford for Crowne to reach Karavelle alive — exposure would destroy the merger and his house.

## Night of the Murder

Vane claims he could not sleep and was walking near the passenger cars after midnight. This is true most nights — he has insomnia and often walks the corridors. No witnesses confirm his whereabouts at the exact time of death. His compartment connects to Lady Tessier's, and they have been overheard talking through the connecting door late at night.

## GM Guidance

Vane has the clearest financial motive and no solid alibi. He makes an excellent red herring — or the actual killer. If guilty, he would need an accomplice with alchemical knowledge (for the toxin) and arcane knowledge (for the seal bypass). If innocent, his desperation makes him a useful source of information about other passengers' secrets — he notices who has money troubles because he's an expert in the subject.
"""
aboutEntities = ["Lord Aldric Vane", "Elias Crowne", "Lady Mireille Tessier"]
aboutPlots = ["The Glass Cage", "The Web"]

[[notes]]
name = "Dossier: Magistra Iris Korr"
content = """
## Background

Fifteen years as a Magewarden. Has learned that the most dangerous lies are the ones people tell themselves. She is traveling on official business she declines to discuss — tracking a smuggler of forbidden alchemical texts whose trail led onto this conveyor. The sealed dispatch case contains evidence from that investigation, unrelated to Crowne. She has a daughter in Valdris, age seventeen, whom she writes to every evening in handwriting so small it fits twice the words on each page.

## Personality

Professional, sharp, tired. She's been doing this work long enough to know that the obvious answer is usually wrong and the convenient suspect is usually innocent. She drinks black tea constantly — the crew keeps a pot ready. She notices everything but comments on very little. Her silence is assessment, not hostility. She has a dry sense of humor that emerges rarely, usually at the expense of people who underestimate her.

## Investigation

The murder of Elias Crowne is technically outside her jurisdiction — Magewardens handle magical crimes, not ordinary homicides. But the locked compartment and missing weapon have her attention because they suggest arcane involvement. She is particularly interested in the player: an amnesiac with blood on their hands who cannot explain where they came from. She has seen memory magic before, and what it leaves behind is rarely innocent.

## GM Guidance

Korr is not convinced the player is guilty. She is not convinced they are not. She is watching for the slip that tells her which. She respects evidence over accusation. If the player produces real leads, she will follow them — even if it points to someone powerful. She is a potential ally if the player proves credible, and a persistent threat if they appear to be the killer. She is also a person — tired, overworked, missing her daughter. A player who connects with her as a human rather than an obstacle may find an unexpected ally.
"""
aboutEntities = ["Magistra Iris Korr", "Player"]
aboutPlots = ["The Glass Cage", "The Hunter"]

[[notes]]
name = "Dossier: Silas"
content = """
## Background

'Silas' is not his real name — it's the third alias he's used this year. He grew up in the Karavelle Warrens, the son of a dockworker who died in a loading accident when Silas was fifteen. He's been with the Harbor Rats ever since — not out of ambition, but because in the Warrens, you belong to someone. He has a younger sister, Lina, age fourteen, whom he's putting through a merchant's academy in the upper city. She believes he's a merchant's factor. Maintaining that lie is the most important thing in his life.

## Personality

He looks like a threat and hates that he looks like a threat. His size, his scars, his broken jaw — none of it was chosen, all of it was survival. He's deeply uncomfortable on the conveyor: too many enclosed spaces, too many wealthy passengers who look at him like he's furniture, too many hours with nothing to do but think. He's not stupid — he's in over his head in an environment he doesn't understand, and he's smart enough to know it. His laugh, when it comes, is surprisingly warm. He eats too fast — a Warrens habit he's never broken.

## Relationship with Crowne

Crowne was his informant in Valdris — feeding shipping manifests, guild politics, blackmail material. In exchange, Silas provided protection and a cut of the profits. Crowne's last message was urgent, almost panicked: he had something big that would change everything, and he would deliver it on the conveyor.

## Current Objective

Find Crowne's missing delivery before the conveyor reaches Karavelle. His superiors will expect him to produce it. He does not particularly care who killed Crowne, but he needs that package — and if the player knows where it is, he will find that out. He genuinely dislikes violence, but it's the only skill anyone ever paid him for.

## GM Guidance

Silas is a blunt instrument in a world of subtle knives, but he's not an antagonist by nature. He can threaten, intimidate, and apply pressure — but he can also be an unexpected ally if the player treats him like a person rather than a problem. His false merchant identity is thin and a source of constant anxiety. If exposed, he becomes volatile. If the player helps protect his secret, they earn his loyalty.
"""
aboutEntities = ["Silas", "Elias Crowne", "Crowne's Ledger"]
aboutPlots = ["The Glass Cage", "The Hunted"]

[[notes]]
name = "Dossier: Lady Mireille Tessier"
content = """
## Background

Half-elven blood keeps the years at bay — she appears thirty-five but is forty-seven. Has buried two husbands, both diplomats, both considerably older and wealthier at their deaths than at their weddings. She is wealthy, connected, and watches everything. Traveling to Karavelle to visit her sister, who is dying of a wasting disease — a sister who is fully human and aging at a rate Mireille can only watch.

## Personality

Dispenses information in small, elegant doses — a hint here, a confidence there — never asking for anything in return, never revealing her own interests. Speaks in a voice barely above a whisper, which forces people to lean in. This is almost certainly deliberate. She is deeply lonely despite her social grace — being half-elven among humans means outliving everyone you love. She compensates by collecting people's stories. She's not malicious; she's trying to fill a void.

## Relationship with Crowne

Crowne's secret source in diplomatic circles. Fed him information for years. She knows more about the contents of his ledger than anyone else aboard — because half of it came from her. Their relationship was professional, then personal, then neither. She doesn't know who killed him and is genuinely frightened — someone who could kill Crowne in a locked room could kill her in hers.

## Behavior

Has the uncanny ability to be in exactly the right place to overhear exactly the wrong thing. She was in the lounge car alone around midnight, nursing a glass of wine. She saw nothing, she claims. She is probably lying.

## GM Guidance

Tessier is the information hub. She knows Vane's debts, knows Silas is not a merchant, knows the player argued with Crowne. She is never the killer — she gains more from keeping secrets than destroying them — but she may know who is. Her help always comes with unspoken strings, but they're the strings of someone who wants to be needed. A player who offers genuine connection rather than transaction may find her unexpectedly vulnerable.
"""
aboutEntities = ["Lady Mireille Tessier", "Elias Crowne", "Crowne's Ledger", "Lord Aldric Vane", "Silas"]
aboutPlots = ["The Glass Cage", "The Web"]

[[notes]]
name = "Dossier: Doctor Cassian Vale"
content = """
## Background

Trained at Valdris Medical College. Served briefly as an army surgeon before moving to civilian practice — he doesn't talk about it. Bound for a new post at a Karavelle hospital. Recently divorced — his wife left him for a colleague at Valdris General. He's not bitter, or says he isn't. He's tired. The Karavelle post is a chance to be somewhere no one knows his personal business.

## Personality

His manner is gentle, unhurried, and reassuring — the product of years delivering bad news to families. He cleans his glasses when he's thinking. He plays chess against himself on a worn travel board in the observation car. He's genuinely kind, but his kindness is also a shield — if he's focused on your problems, he doesn't have to think about his own.

## The Evidence

His medical bag contains a set of surgical blades, one of which exactly matches the wound that killed Elias Crowne. Vale volunteered this fact before anyone asked. He claims the bag was in the dining car during the murder — he had been called to treat a passenger's minor complaint shortly before midnight. He cannot prove where the bag was at the exact moment of death.

## GM Guidance

Vale presents as the kindest person on the conveyor. He is either exactly what he appears or the most dangerous passenger aboard. The alibi gap, the matching blades, and his medical knowledge (paralytic toxins) make him a strong suspect. But consider: his marriage fell apart because of a betrayal. He knows what it feels like to be wrongly accused. If innocent, his surgical expertise makes him a valuable forensic resource. If guilty, his kindness is the most effective camouflage possible.
"""
aboutEntities = ["Doctor Cassian Vale", "Murder Weapon", "Player"]
aboutPlots = ["The Glass Cage", "The Hunter", "The Doctor's Ghost"]

[[notes]]
name = "Dossier: Crystal vi Elaris"
content = """
## Background

Twenty-four. Her mother was a singer of some note in the southern isles — a woman with a voice that could stop a room. She died when Crystal was twelve, leaving her daughter a travel lyre with silver strings and a legacy too heavy for anyone to carry. Crystal has spent the last twelve years trying to be good enough. The Karavelle patronage is her first real opportunity. She is terrified of failing.

## Personality

Warm, impulsive, brave in small ways. She sat beside the player when everyone else recoiled because she knows what it's like to be judged before you open your mouth — being half-elven and a performer means being looked at, assessed, found wanting before you've done anything. She hums constantly without realizing it. She fidgets with her sleeves. She has a sweet tooth and has been working through Bram's supply of honey cakes. She gets motion sick on ley-line conveyors but is too proud to mention it.

## The Anomaly

Silver strings do not resonate with ley-line energy. Ysara va Keth confirmed this. And yet every time the player enters the room, the lyre hums — a soft, almost sub-audible vibration that Crystal feels through her fingertips. She has stopped playing when the player is present, afraid of what the resonance might reveal. The strings are silver. They should not do this. Her mother gave her the lyre. Her mother may have known why.

## GM Guidance

Crystal is warmth in a carriage full of ice. Her bond with the player is the emotional core of the story — but it's not the only thing in her life. She's worried about her performance, haunted by her mother, navigating her first real professional opportunity. The lyre resonance implies a connection that predates the amnesia. The hum grows louder as the player draws closer to the truth. Crystal is not a prize to be won or a sidekick — she's a person with her own fears and ambitions who happens to be drawn to the player for reasons neither of them understand.
"""
aboutEntities = ["Crystal vi Elaris", "Crystal's Lyre", "Player", "Ysara va Keth"]
aboutPlots = ["The Bond", "The Truth", "The Singer's Debut"]

[[notes]]
name = "Dossier: Dravos Thorn"
content = """
## Background

The only drow on the conveyor. Has been on the surface for twenty years — left the Underdark after a conflict he doesn't discuss. His clients range from academic institutions to underground mages, and he does not discriminate because discrimination has defined his entire surface life. Speaks rarely and softly, with the precise diction of someone who learned Common from books and was mocked for his accent.

## Personality

Wears his isolation like a cloak — part protection, part resignation. He expects to be blamed for anything that goes wrong, and that expectation has been confirmed often enough to become a worldview. He is tired of being feared. He loves surface-world coffee — it doesn't exist in the Underdark, and the first time he tasted it, he cried. He doesn't tell people that. Brother Malachai is the only person aboard who treats him without fear or fascination, and Dravos doesn't know what to do with it.

## The Case

The locked alchemical cold-case is chained to his wrist. He claims it contains stabilized organic samples commissioned by the Karavelle Academy of Alchemical Sciences. If he delivers it, he gets a teaching position, legitimacy, a life beyond selling to criminals. If he fails, he goes back to the margins. Ysara's field resonator disagrees with his description: the case emits a harmonic frequency that interferes with the conveyor's ley-line stabilizers. Organic matter does not produce ley-line harmonics.

## Night of the Murder

Dravos was in the observation car at midnight, alone, watching the Grey Flats pass beneath the glass dome. He says he saw nothing. His eyes, adapted to the Underdark, see better in darkness than anyone else on board — which means if someone passed through the observation car that night, he is either the best witness on the conveyor or the most accomplished liar.

## GM Guidance

Dravos has the alchemical expertise to produce the paralytic toxin on the murder weapon. But his isolation and visible otherness make him an easy target for suspicion — too easy. The case's true contents and his real purpose on the conveyor are more interesting than whether he stabbed Crowne. He could be a killer, but he could also be exactly what he claims: a man carrying something valuable, trying to build a better life, terrified that twenty years of surface suspicion will swallow him whole.
"""
aboutEntities = ["Dravos Thorn", "Dravos's Locked Case", "Murder Weapon", "Ysara va Keth", "Brother Malachai"]
aboutPlots = ["The Glass Cage", "The Hunter"]

[[notes]]
name = "Dossier: Ysara va Keth"
content = """
## Background

Forty years studying the imperial ley-line network. Senior scholar at Valdris Academy. Returning to her native Karavelle for the first time in a decade — ostensibly for a conference, actually because her mother is ill and her sister's letters have become increasingly pointed. She's been avoiding this visit for years.

## Personality

The kind of person who will explain resonance frequency theory to a stranger at breakfast and not notice they've stopped listening. Absent-minded, brilliant, genuinely kind but socially oblivious. Her field resonator is her most prized possession. She talks to herself while working — full conversations, both sides. She forgets to eat when she's deep in research. Bram has taken to bringing her sandwiches.

## Key Knowledge

- The 'locked compartment' where Crowne died uses an arcane seal based on personal harmonic resonance, not a physical lock. Such seals can be circumvented by anyone who understands resonance frequencies.
- Exactly three people aboard possess that knowledge. She will not name them casually — doing so would be a professional accusation. She will name them if she trusts the asker.
- Her field resonator detected an unusual oscillation in the ley-line stabilizers starting three hours before the murder. The interference has been growing stronger.
- She suspects deliberate tampering but can't prove it yet.

## GM Guidance

Ysara is the technical expert. She can explain how the murder was done (arcane seal bypass) and identify the growing threat to the conveyor (stabilizer sabotage). She's also a person with her own life — dreading a family reunion, excited about her research, oblivious to social cues. She has no personal connection to Crowne and no particular interest in the murder beyond its technical puzzle. A player who engages her research may find her a willing ally. A player who treats her as just a source of clues will get technical answers and nothing more.
"""
aboutEntities = ["Ysara va Keth", "Kest Winder", "Dravos's Locked Case"]
aboutPlots = ["The Glass Cage", "The Hunter"]

[[notes]]
name = "Dossier: Brother Malachai"
content = """
## Background

Sixty years old. Forty of them spent hearing confessions in the poorest districts of Valdris — the kind of places where the sins are small and the suffering is large. The Star-Veil Order paid for his ticket — a rare indulgence for an itinerant priest. He's traveling to Karavelle to establish a new mission in the dock district, which is where the Order sends priests they've given up on promoting.

## Personality

Has the face of someone who has made peace with everything he has lost. Given to long silences that make other people uncomfortable and him perfectly at ease. Has a dry, unexpected sense of humor that emerges when people stop treating him like a holy object. His knees hurt in cold weather. He carries hard candies in his pocket and offers them to upset passengers — a habit from decades of comforting the grieving. He's surprisingly good at cards.

## The Confession

Malachai was the last person to speak with Crowne before his death. They were seen in the lounge car around 11pm — Crowne agitated, drinking heavily; Malachai listening with the practiced stillness of a man who has heard a thousand confessions. What Crowne said to him, Malachai will not reveal. The seal of the confessional is absolute by the laws of the Star-Veil Order. No amount of pressure — legal, social, or supernatural — will change this.

## GM Guidance

Malachai is a moral witness, not a source of information. He cannot be pressured or tricked into breaking his vows. But his observations of other passengers — who is afraid, who is lying, who is in pain — are sharp and freely given. He's the only person Dravos doesn't flinch from. He's the only person Tessier can't read. If the player earns his trust without demanding his secrets, he may offer guidance — or at least a warning. His presence on the conveyor may not be coincidental — the Order may have known something was going to happen.
"""
aboutEntities = ["Brother Malachai", "Elias Crowne"]
aboutPlots = ["The Glass Cage", "The Bond"]

[[notes]]
name = "Dossier: Garrick"
content = """
## Background

Twelve years in the imperial legions. Served in three campaigns, was decorated twice, discharged last month. The papers say 'medical reasons.' The reality involves a commanding officer, a massacre in a northern village, and Garrick's refusal to follow an illegal order. He was discharged to avoid a court-martial that would have exposed the officer. He's heading to Karavelle for muscle work that won't ask questions — dock security, probably.

## Personality

Speaks more softly than his size suggests — a lifetime of making himself less threatening. Stands with military posture even when relaxed. Cleans his boots obsessively — a legionnaire's habit. He's not stupid, but he's learned that people expect a half-orc legionnaire to be stupid, and sometimes it's easier to let them. His shifting story about Crowne reflects genuine fear of being implicated in something he doesn't understand, not guilt.

## Connection to Player

The mention of the northern provinces triggered something in the player — a cold wind, a stone tower, a face in the snow. Crowne was using Garrick to confirm something about the player's past. What Garrick told him, and whether Garrick is protecting the player or himself, is for the story to discover. His northern posting involved guarding a remote fort where special prisoners were held — political detainees, mages who'd broken imperial law, people the Empire wanted to forget.

## GM Guidance

Garrick is not a suspect — he has no arcane or alchemical knowledge — but he is the most important witness to both Crowne's last hours AND the player's past. His shifting story may be simple distrust of authority, fear of being implicated, or knowledge that the player is someone dangerous. The northern provinces connection is the most important clue about the player's identity. Garrick and Doctor Vale share a quiet understanding — both military-adjacent, both keeping secrets they're not proud of.
"""
aboutEntities = ["Garrick", "Elias Crowne", "Player", "Doctor Cassian Vale"]
aboutPlots = ["The Truth", "The Glass Cage"]

[[notes]]
name = "Dossier: Aldreth Voss"
content = """
## Background

Eight years as the Aethon's conductor. No complaints, no missed schedules, no dissatisfied passengers in his tenure. His uniform is a second skin — navy wool with silver buttons polished to a mirror shine. He waxes his mustache points every morning, a fifteen-minute ritual. His wife thinks he's having an affair because he's never home. The truth is both simpler and sadder: the Aethon is the only place he feels competent.

## Personality

Voss views the murder as a reputational catastrophe and a personal failure. He has deferred Magistra Korr's investigation at every turn, hoping the matter will resolve quietly before Karavelle — not out of guilt, but out of pride. He knows every passenger's drink order. He hums opera while walking the corridors. He genuinely cares about the Aethon and its passengers, but he cares about his reputation more.

## GM Guidance

Voss is an obstacle, not a suspect. He will protect the conveyor's reputation first and the passengers second. In a crisis, he prioritizes appearances over action. The player may need to work around him rather than through him. However, his logbook and the speaking tube system in his office could be useful investigative resources — if the player can get access. He respects authority and procedure. Citing regulations (or having Korr cite them) is the fastest way to get him to cooperate.
"""
aboutEntities = ["Aldreth Voss", "Magistra Iris Korr"]
aboutPlots = ["The Hunted"]

[[notes]]
name = "Dossier: Kest Winder"
content = """
## Background

Has spent more time inside the Aethon's engine than in conversation with another living being. His mind runs three steps ahead of his mouth, which means his explanations start in the middle and work outward. Human violence is outside his frame of reference — machines, he understands. People confuse him.

## Personality

Speaks rapidly, in tangents. Will explain ley-line resonance theory to anyone who maintains eye contact for more than three seconds. Names his tools — the primary stabilizer wrench is 'Brenda.' Has a pet theory that ley-lines are alive in some sense, conscious at a scale humans can't perceive. The other engineers at Valdris think this is absurd. He's not sure they're wrong, but he's not sure they're right either.

## The Interference

Detected an unusual oscillation in the ley-line stabilizers three hours before the murder. It has been growing stronger. He initially suspected a component failure but can't identify which one. The scorch marks on the engine room door mean someone else tried to access his domain — the lock resets every six hours, and Kest is the only one with the current sequence. Someone tried and failed. They may try again.

## GM Guidance

Kest is the only person who can diagnose and repair the stabilizer sabotage. He is oblivious to social nuance but brilliant with arcane engineering. He's the player's best resource for understanding the technical side of the locked-room puzzle. He and Ysara together could identify the interference source. He responds well to genuine curiosity — ask him about his work, and he'll tell you everything. Ask him about the murder, and he'll look confused and change the subject back to stabilizers.
"""
aboutEntities = ["Kest Winder", "Ysara va Keth"]
aboutPlots = ["The Glass Cage", "The Hunter"]

[[notes]]
name = "Dossier: Thea"
content = """
## Background

Grew up in the Karavelle Warrens, the daughter of a human dockworker and an elven mother who disappeared when Thea was seven — walked out one morning and never came back. Thea worked a Warrens tavern from age twelve, serving drinks to Harbor Rats, merchants, and slavers. Learned to read faces, anticipate violence, be invisible when invisibility was survival. Lied about her age to get the Aethon position at seventeen. The conveyor was supposed to be her escape.

## Personality

Still, watchful, economical with words and movement. Moves through the passenger cars with practiced invisibility — she's so quiet that passengers startle when they notice her. Never meets passengers' eyes directly — not submission, but a Warrens survival reflex. Saving money to bring her younger brother, Tomas, age nine, out of the Warrens. Smokes on the exterior gangway when she thinks no one is watching. She's not afraid of the killer. She's afraid of what happens to people like her when they get involved in rich people's problems.

## The Witness

Thea was making her rounds through the passenger cars at midnight. She saw who was in the corridor near Crowne's compartment. She saw who was not in their own compartment when they claimed to be. She has not told anyone — not Voss, not Korr, not the player. Her silence is a survival reflex. She will only confide in someone who proves they are either from the Warrens themselves or willing to risk their own safety for hers. Her testimony likely identifies the killer's movements — or confirms who was definitively not in the corridor. The killer knows she was there. Her silence is a ticking clock.

## GM Guidance

Thea's silence is the key to the locked room. Her testimony resolves alibis. But earning her trust requires proof, not words — the player must demonstrate they value her safety over solving the case. She and Silas have recognized each other as fellow Warrens survivors. Neither has acknowledged it. That recognition could become alliance, or the thing that gets one of them killed.
"""
aboutEntities = ["Thea", "Aldreth Voss", "Elias Crowne", "Silas"]
aboutPlots = ["The Hunted", "The Web", "The Warrens Orphan"]

[[notes]]
name = "Dossier: Oren Locke"
content = """
## Background

Twenty-three years as a purser. Never lost a luggage manifest, mislogged a ticket, or failed to verify a passenger's identity. His passenger ledger never leaves his person — it's under his pillow when he sleeps. He has a small garden in Valdris — roses, primarily — and talks about it to anyone who will listen. He has never taken a vacation. He's not sure he'd know what to do with one.

## Personality

Precise, fastidious, quietly proud of his work. Arranges his inkwells by size. Can tell if someone has touched his desk. He knows several passengers are traveling under false identities — the documents are good but not perfect, and Locke has been doing this long enough to spot a forged imperial seal at twenty paces. He has never exposed a passenger with false papers unless they caused trouble. It's not his job to police identity, only to record it.

## The Manifest

Crowne visited Locke's office the afternoon before his death, requesting access to the passenger manifest — Locke refused, citing privacy regulations. After the murder, someone had been through his records. Nothing taken, but things moved, as if someone was searching for a specific entry. Locke noticed immediately.

## GM Guidance

Locke is a resource for the player who can prove they need the information. The false identities in his ledger are leverage. The person who searched his records after the murder may have been Crowne returning, the killer looking for something, or a third party. He respects procedure — a player who goes through official channels (or has Korr make the request) will get further than one who tries to charm or threaten him.
"""
aboutEntities = ["Oren Locke", "Elias Crowne", "Silas"]
aboutPlots = ["The Glass Cage", "The Web"]

[[notes]]
name = "Dossier: Bram Ironkettle"
content = """
## Background

Fifteen years serving meals on the Aethon. Before that, twenty years in the imperial navy as a cook — served on three warships, survived two sinkings, has a tattoo on his left forearm he won't explain. Has seen every variation of human folly play out over dinner service. One stabbing in a locked compartment is a moderately eventful Tuesday.

## Personality

Grounded, observant, unflappable. Calls everyone 'lad' or 'lass' regardless of age or station — a navy habit. Sings sea shanties while chopping vegetables. Has opinions about everything and shares them freely. He's more annoyed that the murder investigation has disrupted his meal schedule than he is about the murder itself — people kill each other, it's what they do, but a disrupted dinner service is a choice.

## Missing Items

A paring knife (his favorite — perfectly balanced, held an edge beautifully), a length of copper wire, and a small brass fitting have gone missing from the galley over the past week. He assumed it was a passenger with peculiar appetites. He's reconsidering that assumption. The wire and fitting could be components of a resonance bypass device. The paring knife could be the murder weapon or a replacement for it.

## GM Guidance

Bram is comic relief with depth — a source of grounded perspective and quiet observation. He notices who drinks too much, who avoids whom at meals, and who slips out early. His fifteen years of crew knowledge make him a useful ally in navigating the conveyor's physical layout. He knows about the exterior maintenance gangway. He knows which crew doors are usually left unlocked. He'll share this information with anyone who shows genuine respect for the Aethon and its crew.
"""
aboutEntities = ["Bram Ironkettle", "Murder Weapon"]
aboutPlots = ["The Glass Cage", "The Hunter"]

# ── Investigation Threads ──

[[notes]]
name = "Opening Scene"
content = """
The player regains consciousness to the sound of distant screaming. They are in Compartment 3 of Passenger Car A on the Aethon Conveyor, a luxury ley-line transport crossing the uninhabited Grey Flats. Elias Crowne lies dead in the adjacent Compartment 4 — stabbed, door locked from inside, ledger missing. The player's hands are wet with blood. A brass key with the number scratched away lies on the floor.

The conveyor is 30 hours from Karavelle with no stops. Twelve passengers and five crew remain aboard — one a killer. The immediate priorities: clean the blood, account for the key, navigate the first wave of reactions from Conductor Voss and Magistra Korr.

Not everyone will be focused on the murder. Crystal vi Elaris, a half-elf singer, seemed inexplicably drawn to the player — her silver lyre hummed when they entered the observation car. Doctor Cassian Vale offered medical aid and stated he believed the player. Magistra Korr is watching with professional assessment. Bram Ironkettle is trying to figure out how to serve breakfast with a crime scene next to the dining car.

The atmosphere is not uniform panic — it's confusion, fear, curiosity, and (from some) the mundane irritation of travel disrupted. Let different passengers react differently.
"""
aboutEntities = ["Player", "Elias Crowne", "Player's Key", "Crystal vi Elaris", "Doctor Cassian Vale", "Magistra Iris Korr", "Aldreth Voss"]
aboutPlots = ["The Glass Cage", "The Truth", "The Bond"]

[[notes]]
name = "The Locked Room Paradox"
content = """
Compartment 4 was sealed with an arcane lock from the inside. The seal was intact when the body was discovered.

**Ysara va Keth's analysis**: Arcane seals operate on resonance frequencies keyed to the occupant's personal harmonic signature. They can be bypassed by anyone who understands resonance theory — you don't need to break the seal, just convince it that you're the person it's keyed to. Three people aboard possess that knowledge. Ysara will name them when she trusts the asker.

**Kest Winder's readings**: Ley-line interference began three hours before the murder. Scorch marks on the engine car door suggest someone attempted to breach the stabilizer controls.

**Theory**: The murder method and the sabotage may be connected. If the killer destabilized the ley-line current, they might have created a momentary fluctuation that allowed the compartment seal to be circumvented. Or the interference could be unrelated — Dravos's case, a failing component, a third party with their own agenda. Question: was the interference a tool for murder, or a side effect of something else entirely?
"""
aboutEntities = ["Ysara va Keth", "Kest Winder", "Elias Crowne"]
aboutPlots = ["The Glass Cage", "The Hunter"]

[[notes]]
name = "The Missing Ledger"
content = """
Crowne's ciphered ledger contained every secret he ever bought or sold. It was not found on his body or in his compartment.

**Key players**:
- Lady Mireille Tessier: Crowne's informant, knows its contents better than anyone. Claims ignorance of its whereabouts. She's frightened — someone who could kill Crowne could kill her.
- Silas: Was expecting a delivery from Crowne. Searching for 'a package' — likely the ledger. Needs it to satisfy his superiors and protect his sister.
- Lord Aldric Vane: Most immediate motive to destroy it — it contained evidence of his fraud. But destroying it also destroys his leverage over anyone else named in it.

Whoever holds the ledger holds the lives of half the passengers in their hands. If it was thrown into the Grey Flats, the truth dies with it. If it remains on the conveyor, its possessor is almost certainly the killer — or the next victim.
"""
aboutEntities = ["Elias Crowne", "Crowne's Ledger", "Lady Mireille Tessier", "Silas", "Lord Aldric Vane"]
aboutPlots = ["The Glass Cage", "The Web"]

[[notes]]
name = "The Singing Silver"
content = """
Crystal's lyre is strung with silver — a gift from her mother. Silver does not resonate with ley-line energy. Ysara va Keth confirmed the physical properties of silver and is quietly baffled — this is the kind of anomaly that could make a career or embarrass one.

Every time the player enters a room, the lyre hums audibly enough for Crystal to feel it through her fingers. She has stopped playing in the player's presence. The hum has been growing stronger as the journey progresses.

**Possible explanations**:
1. The strings are not truly silver, but an alloy or alchemical composite attuned to something within the player.
2. The player emits an unconventional ley-line signature that even Ysara's field resonator has not identified — possibly related to the stabilizer interference.
3. The bond between Crystal and the player predates the amnesia and is manifesting through the lyre as sympathetic magical resonance.
4. Crystal's mother enchanted the lyre to respond to something — someone — and never told her daughter why.

Crystal is afraid of what the music might reveal — or summon. Ysara desperately wants to study it. The player is at the center of a phenomenon no one can explain.
"""
aboutEntities = ["Crystal vi Elaris", "Crystal's Lyre", "Ysara va Keth", "Player"]
aboutPlots = ["The Bond", "The Truth"]

[[notes]]
name = "The Alchemical Blade"
content = """
The weapon that killed Elias Crowne was thin, surgical, and coated with an alchemical paralytic.

**Doctor Cassian Vale**: Owns a surgical kit containing blades matching the wound profile. His medical bag was unaccounted for around midnight. He claims he was called to treat a passenger but cannot prove where the bag was at the exact moment of death. He volunteered this information before anyone asked — which could be innocence or preemptive deflection.

**Dravos Thorn**: Possesses the alchemical expertise to prepare such a toxin. His locked case contains samples he refuses to show anyone. But he's the obvious suspect — too obvious, and he knows it.

**Bram Ironkettle**: Is missing a paring knife from the galley. The blade is thin and well-maintained — Bram sharpens his knives weekly. It could produce a wound matching Crowne's.

**The blade is still missing**, hidden somewhere on the conveyor. Until it is found, the question of who held it remains open. The paralytic suggests the killer wanted Crowne silent before he could cry out — a practical choice, not a passionate one.
"""
aboutEntities = ["Doctor Cassian Vale", "Dravos Thorn", "Dravos's Locked Case", "Murder Weapon", "Bram Ironkettle"]
aboutPlots = ["The Hunter", "The Hunted"]

[[notes]]
name = "The Player's Key"
content = """
The brass key found beside the player has its compartment number deliberately scratched off. It opens neither Compartment 3 (player) nor Compartment 4 (Crowne).

**Purser Oren Locke** keeps meticulous records of every lock on the conveyor. Possible matching locks:
- A luggage locker in the crew car
- A private storage case belonging to another passenger
- A sealed maintenance hatch along the exterior gangway
- A compartment registered under a false name

Crowne visited Locke's office hours before his death, seeking access to the passenger manifest — perhaps he was looking for whoever held the matching lock. The key may be the first clue to the player's identity, the killer's identity, or the connection between them. The player should be encouraged to try the key in every lock they encounter — it's a physical object with a specific purpose, and finding that purpose is one of the story's central quests.
"""
aboutEntities = ["Player", "Player's Key", "Oren Locke", "Elias Crowne"]
