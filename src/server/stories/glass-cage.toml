[[notes]]
name = "The Star-Veil Confession"
content = """
Brother Malachai was the last person to speak with Elias Crowne. They conversed in the lounge car an hour before the murder — Crowne agitated, drinking heavily; Malachai listening with the stillness of a man who has heard a thousand deathbed secrets.

By the laws of the Star-Veil Order, the seal of confession is absolute. Malachai will not break it under any secular pressure. However, the seal does not prevent him from acting on what he knows — only from revealing it. If he knows the killer's identity, he cannot name them, but he might try to stop them. Or he might believe that some truths are more dangerous than silence.

His presence on the conveyor — a rare luxury ticket paid for by church charity — may not be coincidental. The Order may have known something was going to happen. Or Malachai may simply be an old priest on his way to a new mission, caught up in something larger than himself. His observations of other passengers — who is afraid, who is lying, who is in pain — are sharp and freely given. He watches the passengers not with suspicion but with something closer to sorrow.
"""
aboutEntities = ["Brother Malachai", "Elias Crowne", "Player"]
