id = "glass-cage"

toneDescription = """
A levitating train crossing the uninhabited Grey Flats — equal parts wonder and unease. By day: polished brass, courteous conversation, the rhythm of wheels on ley-line current. By night: whispered secrets, the weight of thirty hours with no exit, and the knowledge that someone aboard is a killer.

The world is gaslamp fantasy — arcane engines and alchemical toxins exist alongside brandy, bad marriages, and the quiet desperation of people who cannot afford to fail. Characters have lives that began before this journey and will continue after it. They get hungry, bored, homesick. They make jokes. They change the subject when it hurts.

Violence is intimate and rare. The murder of Elias Crowne is the worst thing that has happened on the Aethon in eight years. Most passengers are frightened, not calculating. The killer is not a mastermind — just someone who saw no other way out.
"""

settingDescription = """
## The Aethon Conveyor

A luxury ley-line transport — twelve private compartments across two passenger cars, plus observation car, dining car, lounge car, crew car, and engine car. Eight cars total, levitating above the Grey Flats on stabilized ley-line current.

The Grey Flats stretch for hundreds of miles in every direction — an uninhabited expanse of silver-grey stone that reflects the sky like a dull mirror. Nothing grows here. Nothing lives here. The Aethon crosses it in roughly thirty hours, and there are no stops.

### Sensory Details

**Sight**: Polished mahogany paneling, brass fixtures, gas-lamps with amber glass. Deep blue wool carpet in the corridors. The observation car's crystal dome offers an unobstructed view of the sky and the pale glow of the ley-line current beneath the conveyor. At night, the gas-lamps dim and the stars are startlingly bright.

**Sound**: The constant low hum of the ley-line engines — a frequency felt in the teeth more than heard. The click of doors, the murmur of conversation behind compartment walls, the clink of silverware from the dining car. In the lounge car, a clock chimes the half-hour.

**Smell**: Polished brass, alchemical lamp oil (faintly sweet), coffee from the galley, the metallic tang of the ley-line current after rain. Passenger Car B has a faint note of alchemical preservatives near compartment 12.

**Touch**: The subtle vibration through the floor plates. The coolness of brass door handles. The weight of the air before a Grey Flats storm.

### Daily Rhythm

- **06:00–08:00**: Crew shift change. Early risers in the observation car. Bram prepares breakfast in the galley.
- **08:00–10:00**: Breakfast service in the dining car. Most passengers appear. The conductor makes his morning rounds.
- **10:00–12:00**: Midday quiet. Passengers read, write letters, nap. The observation car is popular.
- **12:00–14:00**: Lunch service. Lighter attendance — some passengers keep to their compartments.
- **14:00–17:00**: Afternoon lull. Card games in the lounge car. Thea makes her rounds.
- **17:00–19:00**: Dinner service. The dining car is full. Conversation flows more freely with wine.
- **19:00–22:00**: Evening. The lounge car becomes the social hub. Brandy, cigars, quiet conversations.
- **22:00–06:00**: Night. Gas-lamps dim to half. Thea's night rounds. The conveyor hums through the dark.
"""

[initialScene]
scene_name = "opening"
start_time = 204
location_name = "Observation Car"
characters = ["Player"]

