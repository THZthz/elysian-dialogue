# ── Slice of Life: Non-murder material for breathing room ──

[[notes]]
name = "Slice of Life: The Dining Car"
content = """
The dining car is where social dynamics play out naturally. Use meals as opportunities for non-murder interaction:

- **Breakfast**: Crystal is usually early, nursing tea and staring out the window. Vane takes breakfast in his compartment (he's embarrassed about his financial situation and doesn't want to face Tessier's knowing looks). Garrick eats quickly and leaves — legionnaire habit. Ysara forgets to show up half the time; Bram brings her food.

- **Lunch**: Tessier holds court at the far end of the table, dispensing gossip with the soup. Vale plays chess by himself at a corner seat. Dravos takes meals in his compartment — the dining car's brightness hurts his eyes.

- **Dinner**: The fullest service. Wine flows. Conversations overlap. Voss sometimes joins for a glass of port before his evening rounds. Malachai says grace if asked but doesn't impose it. Silas sits at the end nearest the door — Warrens instinct, never let your back face a room you can't see.

