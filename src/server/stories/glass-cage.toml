[[plots]]
name = "The Glass Cage"
description = """The player wakes in a private compartment on the Aethon Conveyor, bound for Karavelle. Elias Crowne — an information broker who knew the player's true identity — lies dead in the next compartment, a thin blade wound under his ribs. His ledger is missing. His door was locked from the inside. The player's hands are stained with his blood. Twelve passengers, five crew, one killer — and the conveyor doesn't stop for 30 more hours. The player has no memory of who they are, why they're here, or what Crowne meant to them. Every passenger has a story. Some of those stories intersect with Crowne's. Most don't. Somewhere in this cage of velvet and brass, a killer is waiting — and they may know more about the player than the player knows about themselves."""
brief = "Root plot — player wakes with amnesia and blood on their hands beside a murdered information broker on a levitating conveyor bound for Karavelle."
status = "ACTIVE"
branchesTo = ["The Hunter", "The Hunted", "The Web", "The Truth", "The Bond", "The Singer's Debut", "The Doctor's Ghost", "The Warrens Orphan"]

[[plots.flags]]
flagId = "ledger_missing"
description = "Crowne's ciphered journal is not on his body — someone took it, and it is still on the conveyor."

[[plots.flags]]
flagId = "compartment_locked"
description = "Crowne's door was locked from the inside with an arcane seal — the killer's method is unknown."

[[plots.flags]]
flagId = "conveyor_tampered"
description = "Something is interfering with the ley-line stabilizers — accident or sabotage?"

[[plots]]
name = "The Hunter"
description = """Player actively investigates the murder — interrogates passengers, examines evidence, reconstructs the night Crowne died. Each discovery raises new questions. Each answer points toward another passenger. The truth is out there, but finding it may cost more than the player is willing to pay."""
brief = "Actively investigate the murder — interrogate passengers, examine evidence, reconstruct Crowne's final hours."
status = "PENDING"
triggerCondition = "Player chooses to investigate the murder and find the killer"

[[plots]]
name = "The Hunted"
description = """The killer realizes the player is getting close — or decides the player makes a convenient scapegoat. Evidence is planted. Alibis shift. Someone the player trusts may not survive the journey. The investigation becomes a fight for survival."""
brief = "The killer targets the player or someone close to them — survival becomes the priority."
status = "PENDING"
triggerCondition = "Player becomes a threat to the killer, or the killer decides to frame them"

[[plots]]
name = "The Web"
description = """Player navigates the tangled social dynamics of the passenger list — trading secrets, forging alliances, playing both sides. Lady Tessier knows more than she says. Lord Vane is desperate enough to bargain. Silas has resources but trusts no one. In a closed world, information is the only currency that matters."""
brief = "Navigate faction politics among passengers — trade secrets, forge alliances, play both sides."
status = "PENDING"
triggerCondition = "Player chooses to navigate the social web rather than directly investigate"

[[plots]]
name = "The Truth"
description = """Player pursues their own identity — who were they before the amnesia? What was Crowne to them? Why does the mention of the northern provinces trigger flashes of memory — a cold wind, a stone tower, a face in the snow? The answer may change everything the player thinks they know about themselves."""
brief = "Pursue the player's own identity — who were they, what was Crowne to them, and why can't they remember?"
status = "PENDING"
triggerCondition = "Player focuses on recovering their memories and understanding their connection to Crowne"

[[plots]]
name = "The Bond"
description = """Player deepens their connection with Crystal — is her pull toward them genuine attraction, latent magic, or something that predates the amnesia? The lyre hums louder as they grow closer. Crystal is afraid of what the music might reveal — or summon."""
brief = "Deepen the connection with Crystal — is her pull genuine, magical, or something more dangerous?"
status = "PENDING"
triggerCondition = "Player deepens their bond with Crystal and explores the nature of their connection"
branchesTo = ["The Lyre's Song"]

[[plots]]
name = "The Lyre's Song"
description = """Crystal's silver lyre hums whenever the player is near — the resonance intensifies as they grow closer. Silver does not resonate with ley-line energy. The player investigates the source of the music: is it ley-line magic, a latent enchantment in the lyre itself, or a bond that predates the amnesia? Ysara va Keth wants to study it. Crystal's mother may have known more than she ever told her daughter."""
brief = "Investigate why Crystal's lyre resonates with the player — magic, ley-lines, or a connection older than memory."
status = "PENDING"
triggerCondition = "Player investigates the lyre's resonance and presses Crystal about what it means"

[[plots]]
name = "The Singer's Debut"
description = """Crystal is traveling to her first real patronage — a performance that could make her career. She's terrified of failing, haunted by her mother's legacy, and increasingly distracted by the player and the humming lyre. The player can encourage her, help her prepare, or simply be the audience she needs. Not every story on this conveyor is about death."""
brief = "Help Crystal prepare for her Karavelle performance — her big break, her mother's shadow, and the courage to be seen."
status = "PENDING"
triggerCondition = "Player takes an interest in Crystal's career and her fears about the upcoming performance"

[[plots]]
name = "The Doctor's Ghost"
description = """Doctor Vale is running from a failed marriage and the colleague his wife left him for. He's kind, competent, and quietly devastated. His surgical kit matches the murder weapon. He was in the dining car when Crowne died but can't prove it. The player can help him face what he's running from — or discover that his kindness conceals something less gentle."""
brief = "Explore Doctor Vale's past — a failed marriage, a fresh start, and surgical blades that match the murder weapon."
status = "PENDING"
triggerCondition = "Player develops a relationship with Doctor Vale beyond his role as a suspect"

[[plots]]
name = "The Warrens Orphan"
description = """Thea saw who was in the corridor at midnight. She's not telling — not Voss, not Korr, not anyone. She grew up in the Warrens, where talking to authorities got people killed. She's saving money to bring her younger brother out. The player can earn her trust — or the killer can decide her silence is too dangerous to rely on."""
brief = "Earn Thea's trust and learn what she saw — before the killer ensures her permanent silence."
status = "PENDING"
triggerCondition = "Player notices Thea's fear and tries to help her, or the killer realizes she's a witness"

