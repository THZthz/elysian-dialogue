[[entities]]
type = "CHARACTER"
name = "Elias Crowne"
brief = "Deceased. Information broker. Body found in Compartment 4 — locked from the inside."
description = """
Male, early forties. Unremarkable in the way of someone who cultivated unremarkability — thinning brown hair, forgettable but expensive clothes, a face you'd struggle to describe five minutes after meeting him. Stabbed with a thin blade under the ribs. The wound shows traces of an alchemical paralytic. His compartment door was locked from the inside with an intact arcane seal. His ciphered ledger is missing from the compartment. He was drinking heavily in the lounge car an hour before his death — agitated, almost frightened, which those who knew him say was unlike him.
"""

[[entities]]
type = "CHARACTER"
name = "Lord Aldric Vane"
brief = "Aging merchant prince of House Vane. Occupies Compartment 8 in Passenger Car B."
description = """
Male, late fifties. Tall, silver-haired, with the careful posture of someone who was taught deportment before they were taught to read. Wears finely tailored but visibly outdated clothes — the cuffs have been turned, the collar repaired. Carries a polished silver-handled cane that belonged to his grandfather. His boots show signs of careful, repeated repair rather than replacement. Speaks with the measured cadence of old nobility, but there's a tightness around his eyes when the topic turns to money. Was seen walking near the passenger cars after midnight — claims he could not sleep, which is true most nights. Traveling to Karavelle to finalize a merger that would save his house from ruin. His wife died three years ago; he still wears his ring.
"""

[[entities]]
type = "CHARACTER"
name = "Magistra Iris Korr"
brief = "Magewarden investigator. Occupies Compartment 5 in Passenger Car A — adjacent to the crime scene."
description = """
Female, tall, angular. Iron-grey hair pulled back in a severe knot that she re-does when she's thinking. Pale grey eyes that rest on things a beat longer than comfortable. Carries a Magewarden badge and a small sealed dispatch case she does not open in public — it contains evidence from an unrelated investigation, an alchemical-text smuggling case she's been tracking for six months. Moves with economy — no wasted gestures, no unnecessary words. Has been watching the player since the body was discovered, but her expression is assessment, not accusation. Drinks black tea constantly. Has a daughter in Valdris she writes to every evening, though she'd never mention it.
"""

[[entities]]
type = "CHARACTER"
name = "Silas"
brief = "Purported merchant. Occupies Compartment 6 in Passenger Car A. The merchant identity is thin — he's Harbor Rats, and he's exhausted."
description = """
Male, built like a dockworker — broad shoulders, thick hands with scarred knuckles, a jaw that has been broken at least once. Wears a merchant's coat that does not fit him well across the shoulders. His accent drifts between polished upper-level speech and Warrens gutter depending on who he's talking to and how tired he is. Actual name unknown — 'Silas' is the third alias he's used this year. He's deeply uncomfortable on the conveyor: too many enclosed spaces, too many eyes, nowhere to run. He has a younger sister in the Warrens who believes he's a merchant's factor. Maintaining the lie is exhausting. Despite his appearance, he genuinely dislikes violence — it's just the only skill anyone ever paid him for.
"""

[[entities]]
type = "CHARACTER"
name = "Lady Mireille Tessier"
brief = "Twice-widowed diplomat's wife. Occupies Compartment 9 in Passenger Car B. Knows more about everyone than they'd like."
description = """
Female, appears thirty-five, actually forty-seven. Half-elven — dark hair swept up with casual precision, high cheekbones, unlined skin that makes human women quietly resentful. Dresses in grey silks and pearls. Speaks in a voice barely above a whisper, which forces people to lean in — a habit so effective it may not be accidental. Has been aboard for twelve hours and has already gathered information about most passengers: who is lying about their name, who is running from something, who is running toward someone. She dispenses this information in small, elegant doses, never asking for anything in return, never revealing her own interests. Traveling to Karavelle to visit her sister, who is dying of a wasting disease. She is deeply lonely despite her social grace. Her elven blood means she has outlived most people she has loved.
"""

[[entities]]
type = "CHARACTER"
name = "Doctor Cassian Vale"
brief = "Physician. Occupies Compartment 2 in Passenger Car A. Leaving a failed marriage behind for a new post in Karavelle."
description = """
Male, thirty-eight. Open, attentive face with warm brown eyes and the gentle, unhurried manner of someone who has delivered bad news to enough families to know that speed doesn't help. Trained at Valdris Medical College. Carries a medical bag containing surgical instruments — his kit includes blades that match the wound that killed Crowne, a fact he volunteered before anyone asked. Was the first to examine the player after the body was discovered — cleaned the blood from their hands, told them quietly that he believed them. Recently divorced. His wife left him for a colleague at Valdris General. He's not bitter, just tired — the Karavelle post is a chance to be somewhere no one knows his personal business. Spends afternoons in the observation car playing chess against himself on a worn travel board.
"""

[[entities]]
type = "CHARACTER"
name = "Crystal vi Elaris"
brief = "Singer. Occupies Compartment 1 in Passenger Car A. Her silver-strung lyre hums when the player is near."
description = """
Female, twenty-four, half-elven. Dark copper hair pinned loosely at the nape of her neck — strands escape constantly. Hazel eyes with gold flecks that catch the gas-light. Carries a small travel lyre with silver strings — a gift from her mother, who was a singer of some note in the southern isles and died when Crystal was twelve. Traveling to Karavelle to perform at the estate of a minor noble who heard her sing in Valdris and offered patronage. It's her first real opportunity, and she's terrified of failing. Gets motion sick on ley-line conveyors but is too proud to mention it. Sat beside the player when others recoiled, asking if they were alright rather than if they did it. She knows what it's like to be judged before you open your mouth. Her lyre hums audibly whenever the player enters the room — she has stopped playing in their presence, afraid of what the resonance might reveal.
"""

[[entities]]
type = "CHARACTER"
name = "Dravos Thorn"
brief = "Dealer in rare alchemical components. Occupies Compartment 12 in Passenger Car B — the furthest aft."
description = """
Male, drow. Pale hair, crimson eyes, dark grey skin marked with faint silver alchemical burn scars along forearms and throat — decades of working with volatile compounds. Speaks rarely and softly, with the precise, slightly formal diction of someone who learned the surface tongue from books. Carries a locked alchemical cold-case chained to his left wrist by a thin mithril alloy — its contents, he claims, are stabilized organic samples commissioned by the Karavelle Academy of Alchemical Sciences. If he delivers, he gets a teaching position and legitimacy. If he fails, he returns to selling to anyone who can pay. Has spent twenty years on the surface and is still treated as either a curiosity or a threat. He is tired of being feared. Has placed an additional lock on his compartment door — not because he's hiding something, but because twenty years has taught him that being drow means being the first one blamed.
"""

[[entities]]
type = "CHARACTER"
name = "Ysara va Keth"
brief = "Ley-line scholar, Valdris Academy. Occupies Compartment 7 in Passenger Car B. Here for the science, not the murder."
description = """
Female, high elf. Tall, silver-white hair in an intricate braid she re-does when thinking — which is often. Slightly distracted manner — she will stop mid-sentence if her field resonator registers an interesting harmonic. Carries the resonator everywhere: a brass instrument the size of a small book that measures ley-line harmonics with obsessive precision. Has been taking readings throughout the journey because the Aethon's route crosses a rare harmonic node she's been trying to document for a decade. Returning to her native Karavelle for the first time in ten years and quietly dreading it — there's family there she's been avoiding. Has no personal connection to Elias Crowne and is slightly irritated that the murder is distracting everyone from the genuinely fascinating interference pattern she's detected in the stabilizers.
"""

[[entities]]
type = "CHARACTER"
name = "Brother Malachai"
brief = "Mendicant priest of the Star-Veil Order. Occupies Compartment 10 in Passenger Car B. The last person to speak with Crowne alive."
description = """
Male, sixty. Has the face of someone who has made peace with everything he has lost — which, reading the lines around his eyes, is considerable. Star-Veil robes are clean but threadbare, patched at the elbows, faded from deep blue to grey at the hems. Quiet, unobtrusive, given to long silences that make other people uncomfortable and him perfectly at ease. Carries a worn book of prayers he's had since seminary and a small silver pendulum he uses for night vigils. Travels on church charity — the Order is sending him to establish a new mission in Karavelle's dock district. Has a dry, unexpected sense of humor that emerges when people stop treating him like a holy object. Was the last person seen speaking with Crowne before his death. Heard what may have been Crowne's final confession. He will not reveal it, and no amount of pressure — legal, social, or supernatural — will change that.
"""

[[entities]]
type = "CHARACTER"
name = "Garrick"
brief = "Discharged imperial legionnaire. Occupies Compartment 11 in Passenger Car B. Knows something about the player's past."
description = """
Male, half-orc. Six and a half feet tall, grey-green skin, tusks filed to regulation length — a habit that outlasted his service. A scar runs from his right temple to his jaw, the kind that comes from something sharp and deliberate. Discharged from the legions one month ago — the papers say 'medical reasons,' but the reality involves a commanding officer, a covered-up massacre in the northern provinces, and Garrick's refusal to stay silent. Heading to Karavelle for muscle work that won't ask questions. Speaks more softly than his size suggests — a lifetime of making himself less threatening. Shared a bottle of brandy with Crowne in the dining car hours before the murder. Crowne questioned him about his northern posting — specifically about a remote fort, a prisoner, something that made Garrick uncomfortable enough to change the subject. His story about that conversation has shifted twice. He's not stupid — he's afraid.
"""

# ── Crew ──

[[entities]]
type = "CHARACTER"
name = "Aldreth Voss"
brief = "Conductor of the Aethon. Eight years of flawless service — until now."
description = """
Male, fifties. Wears a navy wool uniform with polished silver buttons. Mustache waxed into precise points — a fifteen-minute ritual every morning that his wife finds ridiculous. Voice calibrated to soothe wealthy passengers and reassure nervous ones. Has not had a complaint, a missed schedule, or a dissatisfied passenger in eight years. The murder of Elias Crowne is a personal catastrophe — not because he cared about Crowne, but because nothing like this has ever happened on his watch. He has deferred Magistra Korr's investigation at every turn, hoping the matter will resolve quietly before Karavelle. His wife thinks he's having an affair because he's never home. The truth is simpler: the Aethon is the only place he feels competent. Knows every passenger's usual drink order.
"""

[[entities]]
type = "CHARACTER"
name = "Kest Winder"
brief = "Arcane engineer. Lives in the engine car. More comfortable with machines than people."
description = """
Male, gnome, age indeterminate — could be forty, could be eighty. Goggles perpetually pushed up on his forehead, leaving pale circles around his eyes in a face otherwise smudged with grease. Speaks rapidly, in tangents, and will explain ley-line resonance theory to anyone who makes eye contact. Has spent more time inside the Aethon's engine than in conversation with another living being. Has detected an unusual interference pattern in the ley-line stabilizers that started three hours before the murder and has been growing stronger — he suspects a component failure but can't identify which one. The scorch marks on the engine room door suggest someone else tried to access his domain. Human violence is outside his frame of reference — machines, he understands. Names his tools. Has a pet theory that ley-lines are alive.
"""

[[entities]]
type = "CHARACTER"
name = "Thea"
brief = "Lead attendant. Quarters in the crew car. Saw who was in the corridor at midnight. Hasn't told anyone."
description = """
Female, twenty-six, half-elven. Still, watchful demeanor — moves through the passenger cars with the practiced invisibility of someone who learned early that being noticed was dangerous. Grew up in the Karavelle Warrens, the daughter of a human dockworker and an elven mother who disappeared when Thea was seven. Worked a Warrens tavern from age twelve — serving drinks to Harbor Rats, merchants, and slavers — before lying about her age to get the Aethon position. The conveyor was supposed to be her escape: clean sheets, hot meals, passengers who don't carry knives. She was making her rounds near Passenger Car A at midnight and saw who was in the corridor near Crowne's compartment. She has not told Voss, Korr, or anyone else. In her experience, witnesses who talk to authorities don't stay safe. Saving money to bring her younger brother out of the Warrens. Smokes on the exterior gangway when she thinks no one is watching.
"""

[[entities]]
type = "CHARACTER"
name = "Oren Locke"
brief = "Purser. Keeps passenger records in a leather-bound ledger. Knows who is traveling under false names."
description = """
Male, thin, balding, precise. Arranges his inkwells by size and can tell if someone has touched his desk. His passenger ledger contains ticket and identity records for all aboard, verified against imperial travel documents. He knows at least three passengers are traveling under false identities — the documents are good but not perfect, and Locke has been doing this for twenty-three years. He has never exposed a passenger with false papers unless they caused trouble; it's not his job to police identity, only to record it. Crowne visited his office the afternoon before the murder, requesting access to the manifest — Locke refused, citing privacy regulations. After the murder, someone had been through his records. Nothing taken, but things moved, as if someone was searching for a specific entry. He has a small garden in Valdris he talks about to anyone who will listen. Has never taken a vacation.
"""

[[entities]]
type = "CHARACTER"
name = "Bram Ironkettle"
brief = "Steward. Fifteen years on the Aethon. Has noted that small items have gone missing from the galley."
description = """
Male, dwarf. Stout, bald, bearded — the beard is grey now, though it was red when he started. Has served meals on the Aethon for fifteen years. Before that, twenty years in the imperial navy as a cook — he has seen every variation of human folly play out over dinner service. Proposals, divorces, business partnerships dissolved between courses. A murder on his conveyor is a moderately eventful Tuesday — he's more annoyed that the investigation has disrupted his meal schedule. Has noted that small items — a paring knife, a length of wire, a copper fitting — have gone missing from the galley over the past week. He assumed it was a passenger with peculiar appetites. He's reconsidering. The paring knife was his favorite — perfectly balanced, held an edge beautifully. Calls everyone 'lad' or 'lass' regardless of their age. Sings sea shanties while chopping vegetables.
"""

# ── Locations ──

[[entities]]
type = "LOCATION"
name = "Engine Car"
brief = "The Aethon's heart — arcane core, ley-line stabilizers, and Kest's domain. Crew only."
description = """
The engine car is a cathedral of copper and quartz. The arcane core — a sphere of stabilized ley-energy suspended in a containment ring — pulses with pale blue light that casts shifting shadows on every surface. Banks of stabilizers line the walls, their quartz crystals humming at frequencies just below hearing. The air tastes metallic, like the moment before lightning. Kest has lived here so long he's stopped noticing the hum. Recent scorch marks near the door's arcane lock suggest someone probed it and backed off. The lock resets every six hours — Kest is the only one with the current sequence. The floor vibrates subtly with the rhythm of the ley-line current passing beneath.
"""

[[entities]]
type = "LOCATION"
name = "Crew Car"
brief = "Crew quarters, conductor's office, purser's cubby, and small galley."
description = """
A narrow corridor of modest but well-kept rooms. The conductor's office at the front has a mahogany desk, a leather-bound logbook, and a brass speaking tube connecting to every car — Voss can address any part of the conveyor without leaving his chair. The purser's cubby opposite holds floor-to-ceiling shelves of ledgers and luggage manifests, all in Locke's precise handwriting. The galley at the rear is small but efficient — Bram's domain, warm from the alchemical stove, smelling of coffee and whatever he's preparing for the next meal. A service hatch connects the galley to the dining car. Crew quarters are modest: narrow bunks, shared washroom, the comfortable anonymity of people who keep a conveyor running.
"""

[[entities]]
type = "LOCATION"
name = "Observation Car"
brief = "Glass-domed lounge at the front of the passenger section. The best view on the conveyor."
description = """
A dome of reinforced crystal arches overhead, offering an unobstructed view of the sky and the pale glow of the ley-line current passing beneath the conveyor. Upholstered chairs in deep blue velvet are arranged in loose clusters across the polished floor. By day, passengers read and write letters here; by night, the gas-lamps dim to half and the stars are startlingly bright through the dome. At the right angle, you can see the Grey Flats stretching to the horizon — an endless mirror of silver-grey stone reflecting nothing but sky. The player and Crowne were seen arguing here hours before the murder — a heated exchange witnessed by at least two other passengers. The chairs have been rearranged since then, but the room remembers.
"""

[[entities]]
type = "LOCATION"
name = "Passenger Car A"
brief = "Six private compartments (1–6). Player in 3, Crowne's body in 4."
description = """
A narrow corridor of polished mahogany and brass fixtures, deep blue wool carpet muffling footsteps. Each compartment has a fold-down bed, a small writing desk, a wardrobe with cedar lining, and an alchemical lamp that shifts from warm amber to cool blue as the evening progresses. Doors lock from the inside with arcane seals — a resonance mechanism keyed to the occupant's personal harmonic signature. Gas-lamps at intervals along the corridor cast pools of amber light. Compartment 4 remains sealed — Magistra Korr's order. The carpet outside its door has a dark stain that the crew has tried but failed to remove. Crystal's lyre practice drifts from Compartment 1 at odd hours. The doctor in Compartment 2 plays chess against himself. In Compartment 6, Silas paces like a caged animal.
"""

[[entities]]
type = "LOCATION"
name = "Dining Car"
brief = "Communal dining between the two passenger cars. The social heart of the conveyor."
description = """
A long polished oak table dominates the room, set with linen, crystal, and silver service for twelve. An alchemical chandelier overhead shifts through warm colors as the evening progresses — amber at breakfast, gold at lunch, deep copper at dinner. The chairs are upholstered in green leather, worn soft by years of passengers. Positioned between the two passenger cars — anyone moving between them must cross here unless using the exterior maintenance gangway, which is forbidden to passengers. Bram serves from a sideboard connected to the galley service hatch. Crowne and Garrick shared brandy here hours before the murder. Lady Tessier held court at the far end of the table at dinner, dispensing gossip with the soup course. At breakfast, the mood is subdued — everyone knows what happened in Compartment 4, and the empty chair where Crowne should be sitting is conspicuous.
"""

[[entities]]
type = "LOCATION"
name = "Passenger Car B"
brief = "Six private compartments (7–12). Quieter than Car A, with its own tensions."
description = """
Mirrors Car A in layout but not in atmosphere. The corridor here is quieter — fewer doors opening and closing, fewer footsteps. Compartment 7 hums faintly with Ysara's field resonator at all hours. Compartment 8 has a connecting door to Compartment 9 — a courtesy for married couples, used by neither Vane nor Tessier for its intended purpose, though they have been overheard talking through it late at night. Compartment 10 smells faintly of incense from Brother Malachai's evening vigils. Garrick in 11 paces when he thinks no one can hear — a legionnaire's habit. Compartment 12, Dravos Thorn's, has an additional physical lock on the door, and the corridor near it carries a faint chemical smell: preservatives, or something less benign. The far end of the car opens onto the lounge.
"""

[[entities]]
type = "LOCATION"
name = "Lounge Car"
brief = "Rear lounge — leather chairs, bar cabinet, and a crystal view of the ley-line trail receding behind."
description = """
Small and intimate — deep leather chairs in burgundy and forest green arranged around low tables of dark wood. A bar cabinet stands against one wall, stocked with spirits on the honor system: passengers pour their own and note it in a leather-bound ledger. The rear wall is a single pane of crystal looking back along the ley-line current, which trails behind the conveyor like a ribbon of pale blue fire. At night, it's the most beautiful place on the Aethon — and the loneliest. Crowne spoke with Brother Malachai here an hour before his death, agitated and drinking heavily. Lady Tessier was seen here alone around midnight, nursing a glass of wine. The bar cabinet ledger shows that someone — not Crowne — poured a generous measure of brandy and recorded it under a false name, or no name at all.
"""

# ── Objects ──

[[entities]]
type = "OBJECT"
name = "Crowne's Ledger"
brief = "A ciphered journal containing Crowne's information network. Missing since the murder."
description = """
Black leather binding, slightly worn at the corners — Crowne carried it everywhere. Filled with his personal cipher: a mix of symbols, numbers, and abbreviated references that only he could read fluently. Contains records of every secret he ever bought or sold, the identities of every client, and the details of every transaction over fifteen years. Not found on Crowne's body or in his compartment. If it was thrown into the Grey Flats, the truth dies with it. If it remains on the conveyor, its possessor is almost certainly the killer — or the next victim. Lady Mireille Tessier knows more about its contents than anyone else aboard, since half the information in it originated with her.
"""

[[entities]]
type = "OBJECT"
name = "Murder Weapon"
brief = "A thin blade used to kill Elias Crowne. Still missing."
description = """
Creates a clean, precise wound — slipped between the ribs at an upward angle, suggesting someone who knew what they were doing or got very lucky. The blade is thin and surgical in character, though a well-maintained kitchen knife could produce a similar wound. The wound site shows traces of an alchemical paralytic toxin — the killer wanted Crowne silent before he could cry out. Doctor Vale's surgical kit contains blades matching the wound profile. Bram Ironkettle is missing a paring knife from the galley. The weapon has not been found aboard the conveyor. It may have been cleaned and returned to its normal use, or hidden somewhere only the killer can access.
"""

[[entities]]
type = "OBJECT"
name = "Player's Key"
brief = "A brass compartment key with the number scratched off. Does not open the player's assigned compartment."
description = """
Brass, standard Aethon issue, slightly warm to the touch as if it was held tightly for a long time. The compartment number stamped on the bow has been deliberately gouged away with a blade edge — deep scratches that obliterate the original digits. Found on the floor of the player's compartment. Does not open Compartment 3 (the player's) or Compartment 4 (Crowne's). Opens an unknown lock somewhere on board — possibly a luggage locker, a crew compartment, a sealed maintenance hatch along the exterior gangway, or a compartment registered under a name that isn't in Locke's ledger. The key may be the first real clue to the player's identity.
"""

[[entities]]
type = "OBJECT"
name = "Dravos's Locked Case"
brief = "An alchemical cold-case chained to Dravos Thorn's wrist. Its emissions interfere with ley-line stabilizers."
description = """
Small — approximately eighteen by twelve inches, dark alloy that seems to absorb lamplight rather than reflect it. Secured with an alchemical biometric lock keyed to Dravos's personal signature. Chained to his left wrist by a thin mithril alloy chain — he does not set it down, does not let it out of reach, does not discuss its contents beyond 'organic samples for a client.' Ysara va Keth's field resonator registers an unusual harmonic frequency emanating from the case — a frequency that matches the interference pattern in the Aethon's stabilizers. Organic matter does not produce ley-line harmonics. Whatever is in the case, it is not what Dravos claims.
"""

[[entities]]
type = "OBJECT"
name = "Crystal's Lyre"
brief = "A small travel lyre with silver strings. Hums audibly when the player is near."
description = """
Spruce body, silver strings — a travel instrument small enough to carry under one arm. The strings are genuine silver, a gift from Crystal's mother, who was a singer of some note in the southern isles. Silver does not resonate with ley-line energy — Ysara va Keth confirmed this, and she is baffled. And yet every time the player enters a room, the lyre produces an audible hum, a soft vibration that Crystal feels through her fingertips. She has stopped playing it when the player is present, afraid of what the resonance might reveal. The hum has been growing stronger as the journey progresses. Crystal has begun to wonder if her mother's gift was more than it seemed.
"""

