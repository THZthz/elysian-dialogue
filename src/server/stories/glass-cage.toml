No identification. No memory of who they are or why they are aboard. Woke to the sound of screaming from the adjacent compartment. Hands were wet with still-warm blood. A brass compartment key with its number scratched away lay on the floor nearby. Currently the prime suspect in the murder of Elias Crowne. Moves through the conveyor like someone walking through a dream they can't wake from.
"""

