# ── Toward the Player ──

[[dispositions]]
sourceName = "Crystal vi Elaris"
targetName = "Player"
sentiment = "drawn_to"
summary = "She doesn't know who they are or what they've done. But when they're near, the lyre hums and the world feels sharper, like waking from a long sleep. She sat beside them when everyone else recoiled. She's not sure if it's attraction, magic, or something older than either."

[[dispositions]]
sourceName = "Doctor Cassian Vale"
targetName = "Player"
sentiment = "sympathetic"
summary = "Vale examined the player after the body was found and cleaned the blood from their hands. He stated publicly that he believed them. Whether this is medical judgment, genuine compassion, or something more complicated is unclear — but his kindness, at least, seems real."

[[dispositions]]
sourceName = "Magistra Iris Korr"
targetName = "Player"
sentiment = "watchful"
summary = "Korr is not convinced the player is guilty. She is not convinced they are innocent. She is watching — professionally, patiently — for the slip that tells her which. She respects evidence over accusation and will follow real leads, even if they point somewhere inconvenient."

[[dispositions]]
sourceName = "Thea"
targetName = "Player"
sentiment = "cautious"
summary = "Thea saw who was in the corridor near Crowne's compartment at midnight. She hasn't told anyone. She's watching the player to decide whether they're a threat, a fellow victim, or something she doesn't have a word for yet."

# ── Between NPCs ──

[[dispositions]]
sourceName = "Lord Aldric Vane"
targetName = "Elias Crowne"
sentiment = "resentful"
summary = "Crowne possessed documents proving Vane's balance sheets were fraudulent and had named a price for silence before boarding. Vane could not afford to pay and could not afford exposure. He claims he was walking off insomnia near the passenger cars after midnight."

[[dispositions]]
sourceName = "Silas"
targetName = "Elias Crowne"
sentiment = "dependent"
summary = "Crowne was Silas's informant in Valdris, feeding him shipping manifests and guild politics. Crowne's last message was urgent — he claimed to have something big and promised delivery on the conveyor. Silas needs that delivery to satisfy his superiors and keep his sister safe."

[[dispositions]]
sourceName = "Lady Mireille Tessier"
targetName = "Elias Crowne"
sentiment = "complicated"
summary = "Tessier fed Crowne diplomatic secrets for years. Their relationship was professional, then personal, then neither — the kind of entanglement that leaves both parties knowing too much about each other. She knows the ledger's contents better than anyone. She claims she doesn't know where it is."

[[dispositions]]
sourceName = "Garrick"
targetName = "Elias Crowne"
sentiment = "wary"
summary = "Crowne bought Garrick a drink and questioned him about a military posting in the northern provinces — specifically about a remote fort and a prisoner held there. Garrick's story about this conversation has shifted twice. He's not protecting himself. He may be protecting the player."

[[dispositions]]
sourceName = "Lady Mireille Tessier"
targetName = "Lord Aldric Vane"
sentiment = "curious"
summary = "Tessier knows about Vane's financial troubles — she's known for months. She hasn't told anyone. She might, for a price, or for free if the right person asks. She's watching to see whether Vane will crack before Karavelle."

[[dispositions]]
sourceName = "Ysara va Keth"
targetName = "Kest Winder"
sentiment = "collegial"
summary = "Ysara and Kest share an engineer's fascination with the Aethon's systems. Her resonator readings align with his stabilizer logs. Together they could identify the interference source — if they can get past their mutual tendency to talk in technical tangents."

[[dispositions]]
sourceName = "Silas"
targetName = "Thea"
sentiment = "recognition"
summary = "They're both from the Karavelle Warrens. They recognized each other within hours of boarding — a certain way of moving, of watching, of keeping your back to a wall. Neither has acknowledged it. Neither will, unless they have to."

[[dispositions]]
sourceName = "Brother Malachai"
targetName = "Dravos Thorn"
sentiment = "accepting"
summary = "Malachai is the only person on the conveyor who treats Dravos without fear, fascination, or the careful politeness that's just prejudice with better manners. Dravos doesn't know what to do with this. It unnerves him more than hostility ever did."

[[dispositions]]
sourceName = "Doctor Cassian Vale"
targetName = "Garrick"
sentiment = "familiar"
summary = "Vale served briefly as an army surgeon before moving to civilian practice. He and Garrick recognized the signs in each other — a certain way of standing, of assessing a room. They've shared cigarettes on the observation deck and said almost nothing. It's the most comfortable either has been with anyone aboard."

[[dispositions]]
sourceName = "Crystal vi Elaris"
targetName = "Ysara va Keth"
sentiment = "curious"
summary = "Ysara is fascinated by Crystal's lyre and the impossibility of silver strings resonating with ley-line energy. Crystal finds Ysara's intensity off-putting but is quietly desperate to understand why the lyre hums. She's working up the courage to ask."

