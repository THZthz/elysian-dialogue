[entities.metadata.conditions]

[[entities]]
type = "CHARACTER"
name = "Lady Evelyn Ashworth"
brief = "A young noblewoman and occult scholar."
description = """
Slender and pale, with dark hair typically pinned beneath a travelling hat. She moves with the quiet assurance of old money. Her interests lean towards the esoteric; she owns a respectable private library of forbidden texts and carries a silver athame for protective rituals, along with a leather-bound journal filled with her own sketches of occult symbols. She is travelling with the detective, though the precise nature of their arrangement is her own affair.
"""

[[entities]]
type = "CHARACTER"
name = "Unidentified Victim"
brief = "An unknown middle-aged man, dead, bearing a ritualistic occult symbol on his chest."
description = """
A male corpse, approximately forty years of age, with an unremarkable face. He wears a brown tweed suit, slightly worn at the elbows. No identification papers, wallet, calling cards, or luggage claim ticket are found on his person. His lips show a bluish tint suggestive of poison. A complex circular symbol has been carved into the skin of his chest after death.
"""

# ── Locations ──

[[entities]]
type = "LOCATION"
name = "Engine and Coal Tender"
brief = "Locomotive and fuel car. No passengers allowed."
description = """
A great black iron engine that hauls the train. Coal dust and steam fill the cramped space where the engineer and fireman work. The noise of the pistons and the furnace makes normal conversation impossible.
"""

[[entities]]
type = "LOCATION"
name = "Baggage and Mail Car"
brief = "Storage for luggage, parcels, and post. Access restricted."
description = """
Stacks of trunks, crates, and mailbags secured with rope. The air smells of paper, leather, and oil. A porter may be present to assist with retrieving items.
"""

[[entities]]
type = "LOCATION"
name = "First-Class Sleeper Car"
brief = "First-class accommodation with twelve private compartments."
description = """
A corridor panelled in polished mahogany, lit by brass gas-lamps. Twelve numbered doors line the passage, each opening into a private compartment with a fold‑down bed, a small vanity, and plush upholstery. The car is quiet and well‑kept.
"""

[[entities]]
type = "LOCATION"
name = "First-Class Compartment 12"
brief = "A private first-class compartment, last on the right, where the body lies."
description = """
A compact but comfortable compartment at the far end of the first-class sleeper. Contains a fold‑down bed, a small mahogany vanity with a mirror, an upholstered seat, and a window curtained in heavy velvet. The gas-lamp on the wall casts a warm, steady glow. The door locks from the inside with a brass bolt.
"""

[[entities]]
type = "LOCATION"
name = "Dining Car"
brief = "Communal dining for first- and second-class passengers."
description = """
Long tables covered with white linen, set with crystal decanters and silver cutlery. Meals are served at set times; outside those hours, passengers may sit with drinks and light refreshments. The car carries the lingering scent of roast meat and coffee.
"""

[[entities]]
type = "LOCATION"
name = "Second-Class Car"
brief = "Open seating and compartments for second-class travellers."
description = """
Benches upholstered in dark green fabric, arranged in rows and in shared compartments with sliding doors. Clean and functional, though less ornate than first class. Typically occupied by families, commercial travellers, and persons of moderate means.
"""

[[entities]]
type = "LOCATION"
name = "Observation Car"
brief = "Rear car with large windows and an open platform."
description = """
Wicker chairs face broad panes of glass that look out onto the receding tracks. A door at the rear leads to an open platform where passengers may take the air. At night, the car is usually empty and lit only by a dim lantern.
"""

