id = "express-cult"

toneDescription = """
A Victorian express train, all polished brass and steam, carrying hundreds of souls through the night. The world is one of gas-lamps and subtle magic — gentlemen detectives carry enchanted lockets, and occult symbols are not merely superstition. The mood is one of quiet elegance laced with creeping dread.
"""

settingDescription = """
The Grand Continental Express — a steam locomotive pulling a long chain of carriages through a moonless countryside. The year is 1891. Magic is real but restrained; most passengers possess a minor charm or a family ward, and the educated classes know that the old gods left echoes in the world. The train cuts through thick fog, headlamp barely piercing the gloom. There are no stops for several hours.
"""

[initialScene]
scene_name = "a-body-in-the-night"
start_time = 204  # 8:24 PM, evening
location_name = "First-Class Compartment 12"
characters = ["Player", "Lady Evelyn Ashworth"]

