[[notes]]
name = "Opening Scene: The Body"
content = """
**When the scene opens**: The player is standing inside First-Class Compartment 12, beside the body of an unidentified man. Lady Evelyn Ashworth is present; she discovered the corpse a few minutes earlier and immediately brought the detective. The compartment door is closed. No other passengers are yet aware of the death.

**Immediate sensory details**:
- The gas-lamp hisses softly, casting a yellow glow on the dead man’s terrified face.
- The train sways gently; wheels clatter over a junction.
- The faint smell of coal smoke and lavender polish hangs in the air.

**What the detective knows**:
- He boarded at the last station at Lady Ashworth’s request. She spoke of a premonition, a sense of gathering darkness on this journey, but offered no specifics.
- The victim is a stranger. No passenger has been reported missing.
- A psychometric touch on the sigil returned only an unnatural emptiness — something the detective has never encountered before.

**Immediate options**:
- Examine the body and the sigil more closely (use psychometry again?).
- Question Lady Ashworth about the symbol’s possible origin.
- Search the compartment for hidden luggage, papers, or other clues.
- Decide whether to alert the conductor or keep the death secret to avoid panic.
- Step into the corridor and observe other passengers for signs of guilt or fear.
"""
aboutPlots = ["The Cult on the Express"]
