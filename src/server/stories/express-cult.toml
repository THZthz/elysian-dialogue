[[plots]]
name = "The Cult on the Express"
brief = "A murdered man, an occult symbol, and a train full of potential victims."
description = """
A mysterious murder has occurred in a locked first-class compartment. The victim bears a ritualistic sigil linked to a death cult thought long extinct. The detective must identify the dead man, decipher the meaning of the carving, and uncover the cult’s presence before the train reaches its destination — or before the cult acts again.
"""
status = "ACTIVE"
trigger_condition = "Scene starts with the discovery of the body."

