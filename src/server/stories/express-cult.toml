# ── Characters ──

[[entities]]
id = "00000000-0000-0000-0000-000000000000"
type = "CHARACTER"
name = "Player"
brief = "A private inquiry agent with the arcane gift of psychometry."
description = """
A detective of some repute who consults for the Metropolitan Police on esoteric cases. He carries a small silver magnifying glass that serves as a focus for his psychometric talent — the ability to sense emotional residue and fragmented memories by touching objects. He is travelling aboard the Grand Continental Express at the invitation of Lady Evelyn Ashworth. He is observant, methodical, and accustomed to the weight that lingering psychic impressions leave on his mind.
"""

